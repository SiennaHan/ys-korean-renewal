# 게이트 — 사람이 기억해서 돌리던 것을 기계가 돌린다
#
# **이 저장소에는 게이트가 일곱인데 아무 데서도 자동으로 돌지 않았다.**
# 그래서 낡은 문서가 커밋된 적이 여러 번이다(`developer_tasks.md` DEV-10).
# 새로 만든 검사는 없다 — 있는 것을 묶기만 했다.
#
# ── 일곱 중 여기 있는 것은 여섯이다. 나머지 하나와 그 이유를 적어 둔다 ──
#
# **`build-content.py --check` 는 CI 에서 못 돈다.** 그 검사는 원장 xlsx 와
# 앱 JSON 을 견주는데 **원장이 저장소에 없다**(`.gitignore` 의 `*.xlsx` —
# 교재 파생이라 일부러 뺐다). 스크립트 자신이 "원장을 찾지 못했다" 로 죽는다.
# **콘텐츠를 건드렸으면 손으로 돌려라:**
#     cd app && python3 scripts/build-content.py --check
#
# 어드민(`admin/`)도 여기 없다 — `pnpm typecheck` 가 통과하지 않고 빌드가
# 유틸리티 CSS 를 내지 않는다. **둘 다 리뉴얼 전부터다**(DEV-14).
# 그 카드가 끝나면 여기 넣는다.

name: gates

on:
  push:
  pull_request:
  workflow_dispatch:

# 같은 브랜치에 연달아 밀면 앞의 것을 취소한다 — 뒤엣것만 의미가 있다
concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: 문서
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # **얕은 클론이면 안 된다.** check_docs 의 [관찰 기준] 이
          # `git diff <기준커밋>..HEAD` 를 돌린다 — 그 커밋이 없으면 못 센다
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 외부 패키지가 필요 없다 — 전부 표준 라이브러리다(확인함 2026-08-29)
      - name: check_docs.py
        run: python3 phase1/check_docs.py

  app:
    name: 앱
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # corepack 이 package.json 의 packageManager(pnpm@10.25.0)를 그대로 쓴다.
      # 로컬 pnpm 이 몇이든 CI 와 같은 판이 된다 — 확인했다
      - name: pnpm 준비
        run: corepack enable

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      # 싼 것부터 돌려 빨리 떨어뜨린다
      - name: typecheck
        run: pnpm typecheck

      - name: 목업 대조
        run: pnpm parity:activity

      # check:css 보다 **먼저** 와야 한다 — 아래 이유
      - name: build
        run: pnpm build

      # `css-class-check.py` 는 **빌드 산출 CSS** 를 기준으로 본다.
      # dist 가 비어 있으면 그 검사는 «건너뜀» 을 찍고 **그냥 통과한다**(실측했다:
      # dist 를 치우면 check:css 가 exit 0 을 낸다). 그러면 게이트가 있는데
      # 아무것도 안 보는 상태가 된다. 그래서 빌드 뒤에 돌리고,
      # **정말 봤는지까지 확인한다.**
      - name: check:css (건너뛰지 않았는지까지 본다)
        run: |
          set -o pipefail
          pnpm check:css 2>&1 | tee /tmp/css.log
          if grep -q '건너뜀' /tmp/css.log; then
            echo "::error::check:css 의 일부가 건너뛰었다 — dist 가 비었을 수 있다. build 가 먼저 돌았는지 봐라"
            exit 1
          fi

      # ── biome 은 **0 을 요구하지 않는다** ──
      #
      # `biome check src` 는 아직 통과하지 않는다. 505 에서 줄여 오는 중이고
      # 남은 것은 대부분 `useExhaustiveDependencies` 다 — **훅 의존성 배열은
      # 빼는 것 자체가 동작 변경**이라 한 건씩 사람이 봐야 한다(CLAUDE.md).
      # 0 을 게이트로 걸면 그 판단을 서두르게 만든다.
      #
      # 그래서 **늘어나지만 않으면 통과**시킨다. 줄이면 아래 수를 같이 내려라 —
      # 내리지 않으면 톱니가 헐거워진다.
      #
      # `src` 만 본다. 인자 없는 `biome check` 는 `.parity-out/`·`.claude/` 같은
      # 산출물까지 훑어 1124 건이 나온다 — 저장소가 세는 축은 `src` 다.
      - name: biome (src) — 늘어나지만 않으면 통과
        env:
          BASELINE: '60'   # 2026-08-29 실측
        run: |
          npx biome check src 2>&1 | tee /tmp/biome.log || true
          n=$(grep -oE 'Found [0-9]+ error' /tmp/biome.log | grep -oE '[0-9]+' | head -1)
          n=${n:-0}
          echo "biome(src) = $n 건 · 기준 $BASELINE"
          if [ "$n" -gt "$BASELINE" ]; then
            echo "::error::biome 진단이 $BASELINE → $n 로 늘었다. 새로 들어온 것을 고치거나, 이유를 biome-ignore 에 적어라"
            exit 1
          fi
          if [ "$n" -lt "$BASELINE" ]; then
            echo "::notice::biome 진단이 $n 로 줄었다 — 이 워크플로의 BASELINE 도 $n 으로 내려라"
          fi
