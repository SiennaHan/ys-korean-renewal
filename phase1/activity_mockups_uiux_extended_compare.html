<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>연세 글로벌 한국어 · 확장 활동 시안 비교</title>
<style>
  :root {
    --blue-50:#dbedff; --blue-100:#a2d1ff; --blue-300:#59acff; --blue-500:#0180ff; --blue-600:#0073e6; --blue-900:#24425f;
    --blue-gray-50:#f6f7f8; --blue-gray-100:#e5e8ec; --blue-gray-200:#d7dbe3; --blue-gray-400:#adb3be; --blue-gray-600:#7f848d; --blue-gray-800:#4b505a; --blue-gray-900:#383a3f;
    --gray-200:#eee; --gray-300:#e0e0e0; --gray-400:#bdbdbd; --white:#fff; --yellow-50:#fff8e1; --yellow-300:#ffdb5c;
    --positive:#11c378; --positive-bg:#e7fbce; --destructive:#f15f49; --destructive-bg:#ffe8e8;
    --bench:#eef1f5; --bench-ink:#22262d; --bench-sub:#687180; --bench-line:#d8dde5;
    --font:"Pretendard","Apple SD Gothic Neo",-apple-system,BlinkMacSystemFont,"Malgun Gothic",sans-serif;
  }
  * { box-sizing:border-box; }
  body { margin:0; min-width:320px; background:var(--bench); color:var(--bench-ink); font-family:var(--font); }
  button { font:inherit; }
  .workbench { max-width:1040px; margin:0 auto; padding:34px 20px 72px; }
  .doc { display:grid; grid-template-columns:minmax(0,1fr) minmax(280px,430px); gap:38px; align-items:end; margin-bottom:22px; }
  .kicker { margin-bottom:8px; color:var(--blue-500); font-size:12px; line-height:16px; font-weight:600; letter-spacing:.08em; }
  .doc h1 { margin:0; font-size:32px; line-height:42px; font-weight:600; letter-spacing:-.025em; }
  .doc p { margin:0; color:var(--bench-sub); font-size:14px; line-height:22px; }
  .controls { display:flex; flex-wrap:wrap; align-items:center; gap:7px; padding:12px 0; border-top:1px solid var(--bench-line); border-bottom:1px solid var(--bench-line); }
  .control-label { margin-right:7px; color:#858e9a; font-size:11px; line-height:18px; font-weight:500; }
  .option { min-height:34px; padding:7px 12px; border:1px solid transparent; border-radius:8px; background:transparent; color:#66707e; font-size:13px; line-height:18px; font-weight:500; cursor:pointer; }
  .option:hover { background:rgba(255,255,255,.6); }
  .option[aria-pressed="true"] { border-color:#bddafb; background:var(--white); color:var(--blue-600); font-weight:600; }
  .compare { display:grid; grid-template-columns:1fr 1fr; gap:28px; margin-top:26px; }
  .draft { min-width:0; }
  .draft-head { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:10px; padding:0 2px; }
  .draft-head h2 { margin:0; font-size:16px; line-height:24px; font-weight:600; }
  .draft-head span { color:var(--bench-sub); font-size:12px; line-height:18px; }
  .device { width:362px; max-width:100%; margin:0 auto; padding:1px; border:1px solid #cbd2dc; border-radius:25px; background:#dde2e9; box-shadow:0 18px 46px rgba(36,52,76,.10); }
  .screen { width:100%; height:720px; overflow:hidden; border-radius:23px; display:flex; flex-direction:column; }
  .screen.a { background:var(--white); }
  .screen.b { background:var(--blue-gray-50); }
  .appbar { flex:0 0 58px; display:grid; grid-template-columns:44px 1fr 44px; align-items:center; padding:0 9px; background:var(--white); }
  .icon { width:44px; height:44px; border:0; background:transparent; color:var(--blue-gray-800); display:grid; place-items:center; cursor:pointer; }
  .icon svg { width:24px; height:24px; }
  .lesson { text-align:center; color:var(--blue-gray-900); font-size:16px; line-height:24px; font-weight:600; }
  .continuous { flex:0 0 36px; display:grid; grid-template-columns:1fr auto; align-items:center; gap:10px; padding:0 16px 10px; background:var(--white); }
  .track { height:5px; border-radius:3px; overflow:hidden; background:var(--gray-300); }
  .track i { display:block; height:100%; background:var(--blue-500); }
  .count { color:var(--blue-gray-600); font-size:12px; line-height:16px; font-weight:500; font-variant-numeric:tabular-nums; }
  .fill { flex:1 1 auto; min-height:0; }
  .footer { flex:0 0 88px; padding:16px; background:var(--white); border-top:1px solid var(--blue-gray-100); }

  /* 플래시카드 — 공통 동작, 서로 다른 시각 밀도 */
  .flash-body { flex:1 1 auto; min-height:0; display:flex; flex-direction:column; padding:20px 16px 14px; }
  .flash-stage { position:relative; flex:1 1 auto; min-height:0; perspective:1000px; cursor:pointer; }
  .flash-next { position:absolute; inset:12px 11px -10px; border:1px solid var(--blue-gray-100); border-radius:16px; background:var(--white); opacity:.55; }
  .flash-card { position:absolute; inset:0; transform-style:preserve-3d; transition:transform .3s ease; }
  .flash-card.flipped { transform:rotateY(180deg); }
  .face { position:absolute; inset:0; backface-visibility:hidden; -webkit-backface-visibility:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:24px; background:var(--white); }
  .a .face { border:1px solid var(--blue-gray-100); border-radius:12px; }
  .b .face { border:2px solid var(--blue-gray-100); border-radius:16px; box-shadow:0 8px 24px rgba(36,52,76,.06); }
  .face.back { transform:rotateY(180deg); justify-content:flex-start; padding-top:42px; }
  .face strong { color:var(--blue-gray-900); font-size:32px; line-height:48px; font-weight:600; text-align:center; }
  .face .kind { color:var(--blue-gray-600); font-size:14px; line-height:20px; font-weight:500; }
  .face .picture { width:100%; height:155px; margin-top:34px; display:grid; place-items:center; color:var(--blue-gray-400); font-size:12px; line-height:18px; }
  .a .face .picture { border-top:1px solid var(--blue-gray-100); border-bottom:1px solid var(--blue-gray-100); }
  .b .face .picture { border-radius:12px; background:var(--blue-gray-50); }
  .card-audio { position:absolute; right:15px; bottom:15px; width:40px; height:40px; border:0; border-radius:50%; display:grid; place-items:center; color:var(--blue-600); cursor:pointer; }
  .a .card-audio { background:transparent; }
  .b .card-audio { background:var(--blue-50); }
  .card-audio svg { width:20px; height:20px; }
  .flash-meta { flex:0 0 40px; display:flex; align-items:flex-end; color:var(--blue-gray-600); font-size:12px; line-height:18px; }
  .judge { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .judge button { height:56px; border:0; font-size:16px; line-height:24px; font-weight:600; cursor:pointer; }
  .a .judge button { border-radius:10px; }
  .b .judge button { border-radius:28px; display:grid; grid-template-columns:40px 1fr; align-items:center; padding:8px; }
  .judge .unknown { background:var(--yellow-300); color:var(--blue-gray-900); }
  .judge .known { background:var(--blue-500); color:var(--white); }
  .judge button:disabled { background:var(--gray-200); color:var(--gray-400); cursor:default; }
  .judge .badge { display:none; }
  .b .judge .badge { display:grid; width:40px; height:40px; border-radius:50%; place-items:center; background:rgba(255,255,255,.55); font-size:14px; }
  .judge .label { text-align:center; }

  /* 미션 대화 */
  .scenario { flex:0 0 auto; min-height:76px; padding:13px 16px; display:flex; align-items:flex-start; gap:10px; }
  .scenario.folded { min-height:44px; padding-top:10px; padding-bottom:10px; }
  .scenario-copy { flex:1; }
  .scenario .ko { font-size:16px; line-height:24px; font-weight:600; }
  .scenario .en { margin-top:2px; font-size:13px; line-height:18px; }
  .scenario .fold { width:28px; height:28px; border:0; background:transparent; display:grid; place-items:center; cursor:pointer; }
  .scenario .fold svg { width:20px; height:20px; }
  .a .scenario { background:var(--white); border-bottom:1px solid var(--blue-gray-100); color:var(--blue-gray-900); }
  .a .scenario .en { color:var(--blue-gray-600); }
  .b .scenario { background:var(--blue-500); color:var(--white); }
  .b .scenario .en { color:var(--blue-50); }
  .b .scenario .fold { color:var(--white); }
  .missions { flex:0 0 50px; display:flex; align-items:center; gap:9px; overflow-x:auto; padding:0 14px; background:var(--white); border-bottom:1px solid var(--blue-gray-100); }
  .mission-title { flex:0 0 auto; color:var(--blue-gray-600); font-size:12px; line-height:18px; font-weight:600; }
  .b .mission-title { padding:4px 9px; border-radius:12px; background:var(--blue-gray-50); }
  .mission { flex:0 0 auto; display:flex; gap:4px; align-items:center; color:var(--blue-gray-400); font-size:12px; line-height:18px; font-weight:600; white-space:nowrap; }
  .mission.done { color:var(--positive); }
  .thread { flex:1 1 auto; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:12px; padding:14px; }
  .msg { display:flex; gap:8px; align-items:flex-start; }
  .avatar { width:34px; height:34px; border-radius:50%; flex:0 0 auto; display:grid; place-items:center; background:var(--blue-50); font-size:16px; }
  .bubble-wrap { max-width:248px; }
  .bubble { padding:9px 11px; color:var(--blue-gray-900); font-size:14px; line-height:20px; }
  .a .bubble { border-bottom:1px solid var(--blue-gray-100); }
  .b .bubble { border-radius:12px; background:var(--white); }
  .msg.me { justify-content:flex-end; }
  .msg.me .bubble { color:var(--white); background:var(--blue-500); border:0; }
  .msg.me.bad .bubble { color:var(--blue-gray-900); background:var(--destructive-bg); }
  .tip { margin-top:6px; padding:7px 9px; color:var(--blue-gray-600); font-size:12px; line-height:18px; }
  .a .tip { border-left:2px solid var(--destructive); }
  .b .tip { border-radius:8px; background:var(--white); }
  .typing { width:54px; height:36px; display:flex; align-items:center; justify-content:center; gap:5px; }
  .b .typing { border-radius:12px; background:var(--white); }
  .typing i { width:5px; height:5px; border-radius:50%; background:var(--blue-gray-400); }
  .chat-footer { flex:0 0 92px; display:flex; align-items:center; justify-content:center; position:relative; background:var(--white); border-top:1px solid var(--blue-gray-100); }
  .keyboard { position:absolute; left:20px; width:44px; height:44px; border:0; background:transparent; color:var(--blue-gray-600); display:grid; place-items:center; cursor:pointer; }
  .keyboard svg { width:22px; height:22px; }
  .record-core { width:210px; display:grid; grid-template-columns:56px 1fr; align-items:center; gap:11px; }
  .record-button { position:relative; width:56px; height:56px; border:0; border-radius:50%; background:var(--blue-500); color:var(--white); display:grid; place-items:center; cursor:pointer; }
  .record-button::after { content:""; position:absolute; inset:-5px; border:1px solid transparent; border-radius:50%; }
  .record-button.recording::after { border-color:var(--blue-300); animation:record-pulse 1.2s ease-out infinite; }
  .record-button.done { border:1px solid var(--blue-100); background:var(--blue-50); color:var(--blue-600); }
  .record-button.listen { border:1px solid var(--blue-gray-100); background:var(--white); color:var(--blue-500); }
  .record-button svg { width:24px; height:24px; }
  .record-copy { min-width:0; display:flex; flex-direction:column; align-items:flex-start; text-align:left; }
  .record-copy b { color:var(--blue-gray-900); font-size:14px; line-height:20px; font-weight:600; }
  .record-copy span { color:var(--blue-gray-600); font-size:12px; line-height:16px; font-weight:400; }
  .record-wave { height:12px; display:flex; align-items:center; gap:2px; margin-top:3px; }
  .record-wave i { width:2px; border-radius:2px; background:var(--blue-300); }
  .record-wave i:nth-child(3n+1) { height:5px; } .record-wave i:nth-child(3n+2) { height:11px; } .record-wave i:nth-child(3n) { height:8px; }
  @keyframes record-pulse { 0% { transform:scale(.92); opacity:.8; } 100% { transform:scale(1.16); opacity:0; } }
  @media (prefers-reduced-motion:reduce) { .record-button.recording::after { animation:none; } }

  /* 롤플레잉 */
  .role-title { flex:0 0 auto; padding:8px 16px 14px; background:var(--white); color:var(--blue-900); font-size:20px; line-height:32px; font-weight:600; }
  .role-tabs { flex:0 0 50px; display:flex; align-items:center; gap:8px; padding:0 16px 10px; background:var(--white); }
  .role-tabs button { min-height:36px; padding:7px 13px; border:0; border-radius:8px; background:var(--blue-gray-50); color:var(--blue-gray-600); font-size:13px; line-height:20px; font-weight:600; cursor:pointer; }
  .role-tabs button.on { background:var(--blue-gray-900); color:var(--white); }
  .turns { flex:1 1 auto; min-height:0; overflow-y:auto; padding:2px 16px 8px; }
  .script-meta { display:none; }
  .turn { display:grid; grid-template-columns:26px 1fr 22px; gap:8px; align-items:start; padding:9px 0; }
  .a .turn { border-bottom:1px solid var(--blue-gray-100); }
  .b .role-title { padding:12px 16px 10px; font-size:18px; line-height:26px; }
  .b .role-tabs { flex:0 0 auto; display:grid; grid-template-columns:1fr 1fr; gap:2px; margin:0 16px 12px; padding:3px; border-radius:10px; background:var(--blue-gray-100); }
  .b .role-tabs button { width:100%; min-height:34px; padding:6px 8px; background:transparent; }
  .b .role-tabs button.on { background:var(--white); color:var(--blue-gray-900); box-shadow:0 1px 3px rgba(36,52,76,.10); }
  .b .turns { margin:0 16px; padding:0; border:1px solid var(--blue-gray-100); border-radius:14px; background:var(--white); }
  .b .script-meta { display:flex; justify-content:space-between; padding:10px 12px; border-bottom:1px solid var(--blue-gray-100); color:var(--blue-gray-600); font-size:12px; line-height:18px; font-weight:500; }
  .b .turn { margin:0; padding:11px 12px; border-bottom:1px solid var(--blue-gray-100); border-radius:0; background:var(--white); }
  .b .turn.current { background:var(--blue-50); }
  .turn .who { padding-top:3px; color:var(--blue-gray-900); font-size:13px; line-height:20px; font-weight:600; }
  .turn .line { color:var(--blue-gray-900); font-size:15px; line-height:24px; }
  .turn .listen { padding-top:2px; color:var(--blue-gray-600); }
  .turn .listen svg { width:17px; height:17px; }
  .turn.future .who,.turn.future .line { color:var(--gray-400); }
  .turn.current.ai { background:var(--yellow-50); }
  .turn.current.me { background:var(--blue-50); }
  .record-card { margin:2px 0 7px 34px; padding:9px 11px; border:1px solid var(--blue-gray-100); border-radius:8px; background:var(--white); }
  .b .record-card { margin:0; padding:10px 12px 11px 46px; border:0; border-bottom:1px solid var(--blue-gray-100); border-radius:0; background:#fafdff; }
  .record-card .meta { color:var(--blue-gray-600); font-size:12px; line-height:18px; }
  .record-card .heard { margin-top:5px; color:var(--blue-gray-900); font-size:14px; line-height:20px; }
  .role-footer { flex:0 0 92px; display:flex; align-items:center; justify-content:center; position:relative; background:var(--white); border-top:1px solid var(--blue-gray-100); }
  .arrow { position:absolute; width:40px; height:40px; border:0; background:transparent; color:var(--blue-500); display:grid; place-items:center; cursor:pointer; }
  .arrow:disabled { color:var(--blue-gray-200); cursor:default; }
  .arrow.left { left:16px; } .arrow.right { right:16px; }
  .arrow svg { width:24px; height:24px; }
  .source-note { margin:20px 0 0; padding-top:16px; border-top:1px solid var(--bench-line); color:var(--bench-sub); font-size:12px; line-height:19px; }

  @media (max-width:820px) { .doc { grid-template-columns:1fr; gap:10px; } .compare { grid-template-columns:1fr; gap:36px; } }
  @media (max-width:520px) { .workbench { padding:18px 8px 40px; } .doc { padding:0 8px; } .doc h1 { font-size:25px; line-height:34px; } .controls { padding:10px 8px; } .device { width:min(362px,calc(100vw - 16px)); } }
</style>
</head>
<body>
<main class="workbench">
  <header class="doc">
    <div><div class="kicker">V1 FLOW · OPTION 1 / OPTION 2</div><h1>확장 활동 디자인 비교</h1></div>
    <p>다른 세션의 v1 목업에서 확인한 실제 구조와 문구를 유지한 채, 플래시카드·미션 대화·롤플레잉을 두 시안의 디자인 언어로 나란히 비교합니다.</p>
  </header>
  <nav class="controls" aria-label="비교할 활동">
    <span class="control-label">활동</span>
    <button class="option" data-activity="flash" aria-pressed="true">플래시카드</button>
    <button class="option" data-activity="chat" aria-pressed="false">미션 대화</button>
    <button class="option" data-activity="role" aria-pressed="false">롤플레잉</button>
  </nav>
  <section class="compare" id="compare">
    <article class="draft">
      <header class="draft-head"><h2>시안 1</h2><span>에디토리얼형</span></header>
      <div class="device"><div class="screen a" id="screenA"></div></div>
    </article>
    <article class="draft">
      <header class="draft-head"><h2>시안 2</h2><span>기능 중심형</span></header>
      <div class="device"><div class="screen b" id="screenB"></div></div>
    </article>
  </section>
  <p class="source-note">플래시카드는 지시문 없이 뒤집은 뒤 자기 평가, 미션 대화는 미션 체크가 진행 표시, 롤플레잉은 자유 대화가 아닌 전체 대본 연습이라는 v1 규칙을 그대로 적용했습니다. 녹음이 필요한 활동은 대기·녹음 중·완료의 같은 컨트롤을 사용합니다.</p>
</main>
<script>
const state={activity:"flash",flashIndex:0,flipped:false,known:0,unknown:0,chatTurn:4,chatFold:false,chatRecord:"idle",roleIndex:1,roleDir:"ai",roleRecord:"idle"};
const flashcards=[{word:"사과",meaning:"apple",kind:"명사"},{word:"학교",meaning:"school",kind:"명사"},{word:"친구",meaning:"friend",kind:"명사"}];
const missions=["주문하기","가격 묻기","인사하기"];
const chatTurns=[
  {who:"bot",text:"어서 오세요. 무엇을 드릴까요?"},
  {who:"me",text:"커피 주세요.",hit:0},
  {who:"bot",text:"네, 아메리카노요? 따뜻한 걸로 드릴까요?"},
  {who:"me",text:"얼마예요?",hit:1},
  {who:"bot",text:"삼천 원이에요."},
  {who:"me",text:"고맙습니다 안녕",bad:true,tip:"헤어질 때는 ‘안녕히 계세요’라고 해요."},
  {who:"me",text:"안녕히 계세요.",hit:2},
  {who:"bot",text:"네, 또 오세요!"}
];
const roleTurns=[
  {who:"AI",ko:"어서 오세요. 뭘 도와드릴까요?",en:"Welcome. How can I help you?"},
  {who:"나",ko:"커피 한 잔 주세요.",en:"One coffee, please."},
  {who:"AI",ko:"따뜻한 걸로 드릴까요?",en:"Would you like it hot?"},
  {who:"나",ko:"네, 따뜻한 걸로 주세요.",en:"Yes, hot please."},
  {who:"AI",ko:"삼천 원입니다.",en:"That will be 3,000 won."}
];
const icon={
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  next:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>',
  left:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg>',
  right:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg>',
  up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 15l6-6 6 6"/></svg>',
  down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>',
  volume:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9v6h4l5 4V5L8 9H4zM17 9a4 4 0 010 6"/></svg>',
  mic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg>',
  stop:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4 10-10"/></svg>',
  keyboard:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M8 14h8"/></svg>'
};
function appbar(){return `<div class="appbar"><button class="icon" aria-label="닫기">${icon.close}</button><div class="lesson">1급 4과</div><button class="icon" aria-label="건너뛰기">${icon.next}</button></div>`}
function recordWave(){return `<span class="record-wave" aria-hidden="true">${Array.from({length:12},()=>'<i></i>').join('')}</span>`}
function recordControl(mode,action){const recording=mode==="recording",done=mode==="done";const title=recording?"녹음 중":done?"녹음 완료":"눌러서 녹음";const sub=recording?"한 번 더 누르면 완료":done?"누르면 다시 녹음":"문장을 말해 보세요";const symbol=recording?icon.stop:done?icon.check:icon.mic;return `<div class="record-core"><button class="record-button ${mode}" data-action="${action}" aria-label="${title}">${symbol}</button><span class="record-copy"><b>${title}</b><span>${sub}</span>${recording?recordWave():''}</span></div>`}
function listenControl(){return `<div class="record-core"><button class="record-button listen" data-action="roleNext" aria-label="AI 말 듣기">${icon.volume}</button><span class="record-copy"><b>AI 말 듣기</b><span>듣고 다음 대사로 이동</span></span></div>`}
function flash(){const card=flashcards[state.flashIndex],pct=((state.flashIndex+1)/flashcards.length)*100;return `${appbar()}<div class="continuous"><div class="track"><i style="width:${pct}%"></i></div><span class="count">${state.flashIndex+1}/${flashcards.length}</span></div><div class="flash-body"><div class="flash-stage" data-action="flip"><div class="flash-next"></div><div class="flash-card ${state.flipped?'flipped':''}"><div class="face"><strong>${card.word}</strong><button class="card-audio" data-action="audio" aria-label="${card.word} 발음 듣기">${icon.volume}</button></div><div class="face back"><strong>${card.meaning}</strong><span class="kind">${card.kind}</span><div class="picture">그림</div><button class="card-audio" data-action="audio" aria-label="${card.word} 발음 듣기">${icon.volume}</button></div></div></div><div class="flash-meta"><span>${state.flipped?'다시 뒤집으려면 누르세요':'카드를 눌러 뜻을 보세요'}</span></div></div><div class="footer"><div class="judge"><button class="unknown" data-action="unknown" ${state.flipped?'':'disabled'}><span class="badge">${state.unknown}</span><span class="label">몰라요</span></button><button class="known" data-action="known" ${state.flipped?'':'disabled'}><span class="badge">${state.known}</span><span class="label">알아요</span></button></div></div>`}
function missionChat(){const shown=chatTurns.slice(0,state.chatTurn),hits=new Set(shown.filter(x=>x.hit!==undefined).map(x=>x.hit)),waiting=state.chatTurn<chatTurns.length&&chatTurns[state.chatTurn].who==="bot";return `${appbar()}<section class="scenario ${state.chatFold?'folded':''}"><div class="scenario-copy"><div class="ko">카페에서 음료를 주문해 보세요</div>${state.chatFold?'':'<div class="en">Order a drink at the cafe</div>'}</div><button class="fold" data-action="chatFold" aria-label="시나리오 접기">${state.chatFold?icon.down:icon.up}</button></section><div class="missions"><span class="mission-title">미션 보기</span>${missions.map((m,i)=>`<span class="mission ${hits.has(i)?'done':''}">${hits.has(i)?'✓':'○'} ${m}</span>`).join('')}</div><div class="thread">${shown.map(x=>x.who==="bot"?`<div class="msg"><span class="avatar">🧑‍🍳</span><div class="bubble-wrap"><div class="bubble">${x.text}</div></div></div>`:`<div class="msg me ${x.bad?'bad':''}"><div class="bubble-wrap"><div class="bubble">${x.text}</div>${x.tip?`<div class="tip">! ${x.tip}</div>`:''}</div></div>`).join('')}${waiting?'<div class="msg"><span class="avatar">🧑‍🍳</span><span class="typing"><i></i><i></i><i></i></span></div>':''}</div><div class="chat-footer"><button class="keyboard" aria-label="키보드 입력">${icon.keyboard}</button>${recordControl(state.chatRecord,"chatRecord")}</div>`}
function roleplay(){const current=roleTurns[state.roleIndex],mine=current.who==="나";const rows=roleTurns.map((t,i)=>{const cls=i===state.roleIndex?'current':i>state.roleIndex?'future':'';const record=mine&&i===state.roleIndex&&state.roleRecord==="done"?`<div class="record-card"><div class="meta">${t.en} · [${t.ko}]</div><div class="heard">나의 발음 · ${t.ko}</div></div>`:'';return `<div class="turn ${cls} ${t.who==='나'?'me':'ai'}"><span class="who">${t.who}</span><span class="line">${t.ko}</span><span class="listen">${i<=state.roleIndex?icon.volume:''}</span></div>${record}`}).join('');return `${appbar()}<div class="role-title">AI와 함께 대화를 연습해 보세요.</div><div class="role-tabs"><button class="${state.roleDir==='ai'?'on':''}" data-action="roleAi">AI &gt; 나</button><button class="${state.roleDir==='me'?'on':''}" data-action="roleMe">나 &gt; AI</button></div><div class="turns"><div class="script-meta"><span>전체 대본</span><span>${state.roleIndex+1} / ${roleTurns.length}</span></div>${rows}</div><div class="role-footer"><button class="arrow left" data-action="rolePrev" ${state.roleIndex===0?'disabled':''}>${icon.left}</button>${mine?recordControl(state.roleRecord,"roleRecord"):listenControl()}<button class="arrow right" data-action="roleNext" ${state.roleIndex===roleTurns.length-1?'disabled':''}>${icon.right}</button></div>`}
function render(){const html=state.activity==="flash"?flash():state.activity==="chat"?missionChat():roleplay();document.getElementById('screenA').innerHTML=html;document.getElementById('screenB').innerHTML=html;document.querySelectorAll('[data-activity]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.activity===state.activity)))}
function resetActivity(activity){state.activity=activity;state.flashIndex=0;state.flipped=false;state.known=0;state.unknown=0;state.chatTurn=4;state.chatFold=false;state.chatRecord="idle";state.roleIndex=1;state.roleDir="ai";state.roleRecord="idle";render()}
document.querySelector('.controls').addEventListener('click',e=>{const b=e.target.closest('[data-activity]');if(b)resetActivity(b.dataset.activity)});
document.getElementById('compare').addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;if(a==="flip")state.flipped=!state.flipped;else if(a==="known"&&state.flipped){state.known++;state.flashIndex=(state.flashIndex+1)%flashcards.length;state.flipped=false}else if(a==="unknown"&&state.flipped){state.unknown++;state.flashIndex=(state.flashIndex+1)%flashcards.length;state.flipped=false}else if(a==="chatFold")state.chatFold=!state.chatFold;else if(a==="chatRecord"){if(state.chatRecord==="idle")state.chatRecord="recording";else if(state.chatRecord==="recording"){state.chatRecord="done";state.chatTurn=state.chatTurn>=chatTurns.length?1:Math.min(chatTurns.length,state.chatTurn+1)}else state.chatRecord="recording"}else if(a==="roleAi")state.roleDir="ai";else if(a==="roleMe")state.roleDir="me";else if(a==="rolePrev"){state.roleIndex=Math.max(0,state.roleIndex-1);state.roleRecord="idle"}else if(a==="roleNext"){state.roleIndex=Math.min(roleTurns.length-1,state.roleIndex+1);state.roleRecord="idle"}else if(a==="roleRecord"){state.roleRecord=state.roleRecord==="idle"?"recording":state.roleRecord==="recording"?"done":"recording"}else if(a==="audio")b.animate([{transform:'scale(1)'},{transform:'scale(.95)'},{transform:'scale(1)'}],180);render()});
render();
</script>
</body>
</html>
