     조정값(TUNING)을 오른쪽에서 바꾸며 직접 해 보고 고치기 위한 것.
     문항 1149개 전부 실제 데이터(n1_word_quiz.json)를 압축해 넣었다.
     그림 문항은 정적 서버가 떠 있어야 보인다 — http://localhost:8741 로 열 것. -->

<style>

<body>
<main class="workbench">
  <header class="doc">
    <div><div class="kicker">PROTOTYPE · 돌려 보고 고치는 것</div><h1>VocaShot 혼자 하기</h1></div>
    <p>실제 문항 <b>1149개</b>로 도는 시제품입니다. 오른쪽 <b>조정값</b>을 바꾸고
       다시 시작하면 그대로 반영됩니다. 표에서 정하지 말고 <b>해 보고 고치기</b> 위한 것입니다.</p>
  </header>
  <nav class="controls">
    <div class="control-group">
      <span class="control-label">조작</span>
      <button class="option" id="restart">처음으로</button>
    </div>
    <div class="control-group">
      <span class="control-label">키보드</span>
      <span class="control-label" style="color:#66707e">1~4 고르기 · Enter 발사</span>
    </div>
    <div class="control-group" data-set="width">
      <span class="control-label">폭</span>
      <button class="option" data-value="390" aria-pressed="true">390</button>
      <button class="option" data-value="360" aria-pressed="false">360</button>
      <button class="option" data-value="320" aria-pressed="false">320</button>
    </div>
  </nav>
  <section class="stage">
    <div class="device-wrap">
      <div class="device" id="device"><div class="screen" id="screen"></div></div>
      <div class="caption" id="caption">390 × 720</div>
    </div>
    <aside class="notes">
      <div class="note-section">
        <h2>조정값</h2>
        <div class="tune" id="tune"></div>
        <p class="note">바꾼 값은 <b>다음 판</b>부터 적용됩니다.</p>
      </div>
      <div class="note-section">
        <h2>이번 판 기록</h2>
        <div class="log" id="log"></div>
      </div>
    </aside>
  </section>
</main>
<script src="vocashot_bank.js"></script>
<script>
const I={
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>',
  user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0116 0"/></svg>',
};
const IMG_BASE="/korean-master/korean-master/public/textbook/";

/* 난이도의 전부. 여기 여덟 개만 만지면 된다 */
const TUNING={
  fallFirstSec:7.0, fallMinSec:3.0, fallStepSec:0.25, hardModeBonusSec:2.0,
  scoreBase:10, scoreSpeedMax:10, hearts:5, retryAfterN:3,
  maxQuestions:30,   /* 한 판 문항 상한. 0 이면 무제한(하트 0 까지) */
};
const TUNE_META=[
  ["fallFirstSec","첫 낙하(초)",0.5],["fallMinSec","최소 낙하(초)",0.5],
  ["fallStepSec","줄어드는 폭(초)",0.05],["hardModeBonusSec","직접 입력 가산(초)",0.5],
  ["scoreBase","정답 기본",1],["scoreSpeedMax","속도 보너스 상한",1],
  ["hearts","하트",1],["retryAfterN","재출제 간격(문항)",1],
  ["maxQuestions","한 판 문항 상한",5],
];

const LEVELS=[1,2,3,4,5,6,7,8];
const BEST=JSON.parse(localStorage.getItem("vocashot-best")||"{}");
let S={ view:"start", level:2, mode:"easy", width:"390" };
let G=null, raf=0, timer=0;
let FEEDBACK_MS=600;   /* 정답/오답을 보여 주는 시간. 자동 검사에서는 0 으로 낮춘다 */

const shuffle=a=>{const x=a.slice(); for(let i=x.length-1;i>0;i--){
  const j=Math.floor(Math.random()*(i+1)); [x[i],x[j]]=[x[j],x[i]];} return x;};

/* ── 판 시작 ── */
function startRun(){
  const pool=shuffle(BANK.filter(q=>q.l===S.level));
  G={ queue:pool.map(q=>({q,retry:false})), idx:0, served:0,
      score:0, hearts:TUNING.hearts, correct:0, asked:0,
      missed:new Map(), log:[], done:false };
  S.view="play"; nextMeteor();
}

function fallSec(){
  const n=G.served;
  let s=Math.max(TUNING.fallMinSec, TUNING.fallFirstSec - TUNING.fallStepSec*n);
  if(S.mode==="hard") s+=TUNING.hardModeBonusSec;
  return s;
}

function nextMeteor(){
  cancelAnimationFrame(raf); clearTimeout(timer);
  const cap=TUNING.maxQuestions>0 && G.served>=TUNING.maxQuestions;
  if(G.hearts<=0 || cap || G.idx>=G.queue.length){ endRun(); return; }
  const item=G.queue[G.idx];
  const dur=fallSec();
  G.locked=false;
  G.cur={ ...item, dur, start:performance.now(),
    choices: shuffle([item.q.a, ...shuffle(item.q.w).slice(0,3)]) };
  G.served++; G.asked++;
  renderPlay();
  const el=document.querySelector('.meteor'), sky=document.querySelector('.sky');
  if(el&&sky){
    const travel=sky.clientHeight-el.offsetHeight;
    el.animate([{transform:'translate(-50%,0)'},{transform:`translate(-50%,${travel}px)`}],
      {duration:dur*1000, easing:'linear', fill:'forwards'});
  }
  timer=setTimeout(()=>resolve(null), dur*1000);
}

function resolve(picked){
  if(!G || G.locked || !G.cur) return;   /* 한 유성에 한 번만 */
  G.locked=true;
  clearTimeout(timer);
  const c=G.cur, right = picked!==null && picked.trim()===c.q.a;
  const remain=Math.max(0, c.dur*1000-(performance.now()-c.start))/1000;
  let gained=0;
  if(right){
    G.correct++;
    /* 재출제로 맞힌 것은 점수를 주지 않는다 — 하트를 이미 잃었다 */
    if(!c.retry) gained=TUNING.scoreBase+Math.floor(TUNING.scoreSpeedMax*remain/c.dur);
    G.score+=gained;
    if(c.retry && G.missed.has(c.q.a)) G.missed.get(c.q.a).got=true;
  } else {
    G.hearts--;
    if(!G.missed.has(c.q.a))
      G.missed.set(c.q.a,{w:c.q.a, m:c.q.m||"(그림)", got:false});
    /* 틀린 문항은 한 번만 다시 낸다 */
    if(!c.retry) G.queue.splice(G.idx+1+TUNING.retryAfterN, 0, {q:c.q, retry:true});
  }
  G.log.unshift({w:c.q.a, t:(c.dur-remain).toFixed(1), s:gained, right, retry:c.retry,
    to:picked===null});
  G.fb = right ? (gained?`정답 +${gained}`:"정답 · 다시 맞힘") : (picked===null?"놓침":"오답");
  G.fbOk = right;
  renderPlay(true); drawLog();
  G.idx++;
  setTimeout(()=>{ G.fb=null; nextMeteor(); }, FEEDBACK_MS);
}

function endRun(){
  cancelAnimationFrame(raf); clearTimeout(timer);
  G.done=true;
  const prev=BEST[S.level]||0;
  G.isBest=G.score>prev;
  if(G.isBest){ BEST[S.level]=G.score; localStorage.setItem("vocashot-best",JSON.stringify(BEST)); }
  G.prev=prev;
  S.view="result"; render();
}

/* ── 화면 ── */
function startView(){
  const best=BEST[S.level];
  return `<div class="g-dark" style="display:flex;flex-direction:column;height:100%">
    <div class="g-head">
      <div class="nm">
        <button class="back"><i>${I.back}</i></button>
        <div><h1>VocaShot</h1><div class="sub">혼자 하기</div></div>
      </div>
    </div>
    <div class="g-body">
      <span class="g-lb">급</span>
      <div class="lv">${LEVELS.map(n=>
        `<button data-lv="${n}" class="${n===S.level?'on':''}">${n}급</button>`).join("")}</div>
      <span class="g-lb">입력 방식</span>
      <div class="seg">
        <button data-mode="easy" class="${S.mode==='easy'?'on':''}">4개 중 고르기</button>
        <button data-mode="hard" class="${S.mode==='hard'?'on':''}">직접 입력</button>
      </div>
      ${best
        ? `<div class="best"><span class="k">${S.level}급 최고 점수</span>
             <span class="v">${best}</span></div>`
        : `<div class="best none"><span class="k">${S.level}급 최고 점수</span>
             <span class="v">아직 없음</span></div>`}
    </div>
    <div class="g-dock"><button class="g-go" id="go">시작하기</button></div>
  </div>`;
}

function playMarkup(){
  const c=G.cur;
  const body = c.q.i
    ? `<img src="${IMG_BASE}${c.q.l}/${c.q.i}" alt="">`
    : `<div class="txt">${c.q.m}</div>`;
  const dock = S.mode==="easy"
    ? `<div class="choices">${c.choices.map((x,i)=>
        `<button data-pick="${x}">${x}</button>`).join("")}</div>`
    : `<div class="typerow"><input id="typed" autocomplete="off" autocapitalize="off"
         placeholder="한국어 단어를 입력하세요"><button id="fire">발사!</button></div>`;
  return `<div class="g-dark" style="display:flex;flex-direction:column;height:100%">
    <div class="p-head">
      <div><h1>VocaShot</h1><div class="sub">${S.level}급 · ${
        S.mode==='easy'?'4개 중 고르기':'직접 입력'} · ${c.dur.toFixed(1)}초</div></div>
      <div style="display:flex;align-items:center;gap:12px">
        <div class="hearts">${Array.from({length:TUNING.hearts},(_,i)=>
          `<i class="${i<G.hearts?'':'off'}"></i>`).join("")}</div>
        <div style="text-align:right"><div class="r-k">SCORE</div>
          <div class="r-v">${G.score}</div></div>
      </div>
    </div>
    <div class="sky"><div class="meteor">${body}</div><div class="ground"></div></div>
    <div class="fb ${G.fbOk?'ok':'no'}">${G.fb||""}</div>
    <div class="p-dock">${dock}</div>
  </div>`;
}

function resultView(){
  const missed=[...G.missed.values()];
  const clean=missed.length===0;
  return `<div class="g-dark" style="display:flex;flex-direction:column;height:100%">
    <div class="r-head">
      <div class="nm"><span class="av">${I.user}</span>
        <div><h1>VocaShot</h1><div class="sub">${S.level}급 · ${
          S.mode==='easy'?'4개 중 고르기':'직접 입력'}</div></div></div>
      <div style="text-align:right"><div class="r-k">BEST</div>
        <div class="r-v" style="color:#fbbf24">${BEST[S.level]||0}</div></div>
    </div>
    <div class="r-body">
      <h2 class="r-ttl ${G.hearts>0?'ok':'no'}">${G.hearts>0?"완주":"게임 오버"}</h2>
      <p class="r-desc">${G.hearts>0
        ? `${G.asked}문항을 하트 ${G.hearts}개 남기고 끝냈습니다.`
        : "하트가 0이 되어 끝났습니다."}</p>
      <div class="r-score">
        <div class="r-k">내 점수</div>
        <p class="big">${G.score}</p>
        ${G.isBest ? `<span class="r-new">최고 점수 경신</span>`
                   : `<p class="r-prev">최고 점수 ${G.prev}</p>`}
      </div>
      <div class="r-stats">
        <div class="r-stat"><div class="r-k">맞힘</div>
          <div class="v" style="color:#34d399">${G.correct}</div></div>
        <div class="r-stat"><div class="r-k">낸 문항</div>
          <div class="v" style="color:#e2e8f0">${G.asked}</div></div>
      </div>
      ${missed.length
        ? `<div class="r-wrong"><div class="r-k cap">놓친 단어 ${missed.length}개 ·
             다시 맞힘 ${missed.filter(x=>x.got).length}</div>
             ${missed.map(x=>`<div class="r-row ${x.got?'got':''}"><span class="w">${x.w}</span>
               <span class="m">${x.m}</span>
               ${x.got?'<span class="re">다시 맞힘</span>':''}</div>`).join("")}</div>`
        : `<div class="r-empty">놓친 단어가 없습니다.</div>`}
    </div>
    <div class="r-dock">
      <button class="r-again" id="again">다시 하기</button>
      <button class="r-exit" id="exit">나가기</button>
    </div>
  </div>`;
}

function renderPlay(keep){
  const scr=document.getElementById('screen');
  if(!keep){ scr.innerHTML=playMarkup(); const t=document.getElementById('typed'); if(t) t.focus(); }
  else {
    const fb=scr.querySelector('.fb');
    if(fb){ fb.textContent=G.fb||""; fb.className='fb '+(G.fbOk?'ok':'no'); }
    const sc=scr.querySelector('.p-head .r-v'); if(sc) sc.textContent=G.score;
    scr.querySelectorAll('.hearts i').forEach((el,i)=>
      el.className = i<G.hearts?'':'off');
    scr.querySelectorAll('.choices button,.typerow button,.typerow input')
      .forEach(b=>b.disabled=true);
  }
}
function render(){
  const dev=document.getElementById('device'), scr=document.getElementById('screen');
  dev.style.width=(+S.width+4)+'px';
  document.getElementById('caption').textContent=`${S.width} × 720`;
  if(S.view==='start') scr.innerHTML=startView();
  else if(S.view==='result') scr.innerHTML=resultView();
  else renderPlay();
  document.querySelectorAll('[data-set="width"] .option').forEach(b=>
    b.setAttribute('aria-pressed',String(b.dataset.value===S.width)));
}
function drawLog(){
  document.getElementById('log').innerHTML=G.log.map(r=>
    `<div><span class="w">${r.w}${r.retry?' ↻':''}</span>
      <span class="t">${r.to?'—':r.t+'s'}</span>
      <span class="s ${r.right?'ok':'no'}">${r.right?'+'+r.s:'✕'}</span></div>`).join("");
}
function drawTune(){
  document.getElementById('tune').innerHTML=TUNE_META.map(([k,lb,st])=>
    `<label for="t_${k}">${lb}</label>
     <input id="t_${k}" type="number" step="${st}" value="${TUNING[k]}" data-k="${k}">`).join("");
}

/* ── 입력 ── */
document.addEventListener('click',e=>{
  const w=e.target.closest('[data-set="width"] .option');
  if(w){ S.width=w.dataset.value; render(); return; }
  if(e.target.closest('#restart')){ cancelAnimationFrame(raf); clearTimeout(timer);
    S.view='start'; render(); return; }
  const lv=e.target.closest('[data-lv]');
  if(lv){ S.level=+lv.dataset.lv; render(); return; }
  const md=e.target.closest('[data-mode]');
  if(md){ S.mode=md.dataset.mode; render(); return; }
  if(e.target.closest('#go')||e.target.closest('#again')){ startRun(); return; }
  if(e.target.closest('#exit')||e.target.closest('.back')){ S.view='start'; render(); return; }
  const pick=e.target.closest('[data-pick]');
  if(pick && !pick.disabled){ resolve(pick.dataset.pick); return; }
  if(e.target.closest('#fire')){ const t=document.getElementById('typed');
    if(t && !t.disabled) resolve(t.value); return; }
});
document.addEventListener('input',e=>{
  const k=e.target.dataset.k; if(!k) return;
  const v=parseFloat(e.target.value); if(!Number.isNaN(v)) TUNING[k]=v;
});
document.addEventListener('keydown',e=>{
  if(S.view!=='play'||!G||G.done) return;
  if(S.mode==='easy' && /^[1-4]$/.test(e.key)){
    const b=document.querySelectorAll('.choices button')[+e.key-1];
    if(b && !b.disabled) resolve(b.dataset.pick);
  }
  if(S.mode==='hard' && e.key==='Enter'){
    const t=document.getElementById('typed'); if(t && !t.disabled) resolve(t.value);
  }
});
drawTune(); render();
</script>
