<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
        <!-- <meta
            name="viewport"
            content="width=device-width, initial-scale=1, shrink-to-fit=no"
        /> -->
        <title>연세 글로벌 한국어</title>
        <meta
            name="description"
            content="연세대학교 한국어학당과 프리윌린이 함께 만든 '연세 글로벌 한국어' 어플리케이션"
        />
        <meta
            name="keywords"
            content="연세대학교, 한국어학당, 프리윌린, 연세 글로벌 한국어,"
        />
        <meta name="author" content="Mohammed Raad" />

        <!-- Favicon -->
        <link rel="icon" href="/icons/favicon.ico"/>

        <!-- Pretendard — 여기서 불러온다. styles/globals.css 의 @import 로는 안 된다:
             Tailwind v4 의 import 해석기가 원격 @import 를 버려서 빌드 CSS 에
             @font-face 가 0개가 됐고, 폰트가 아예 로드되지 않고 있었다 (2026-08-24). -->
        <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />

        <!--
            Tailwind 를 브라우저에서 실시간 컴파일하던 CDN 스크립트를 뺐다 (2026-08-26).

            이 프로젝트는 이미 빌드 때 Tailwind 를 만든다(@tailwindcss/postcss →
            static/css). CDN 판은 그것을 **한 번 더** 만들어 첫 페인트 뒤에
            <style> 21,940자를 끼워 넣었고, 그래서 아이콘이 잠깐 제 크기로
            보였다가 줄어드는 깜빡임이 있었다.

            지우기 전에 확인한 것 — 화면 여덟(홈·교재학습·표현클립·마이페이지·
            게임·어휘·자모·플래시카드)에서 DOM 이 쓰는 클래스를 빌드 CSS(1,205개)와
            런타임 <style>(177개)에 각각 맞춰 보니 **런타임에만 있는 것이 0개**였다.
            템플릿으로 조립하는 유틸 클래스도 없다(있으면 빌드 스캐너가 놓친다).
        -->
    </head>

    <body>
        <div id="app"></div>
    </body>
</html>
